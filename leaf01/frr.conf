frr defaults traditional
hostname leaf01
no ipv6 forwarding
!
interface br10
 description VLAN 10 SVI
exit
!
interface eth1
 description SPINE01
 ip address 172.31.1.1/31
exit
!
interface eth2
 description SPINE02
 ip address 172.31.1.5/31
exit
!
interface eth3
 description CLIENT1
exit
!
interface eth3.10
 description CLIENT1 VLAN10 (RED)
exit
!
interface lo
 description Router ID
 ip address 172.29.1.3/32
exit
!
interface lo1
 description VTEP source
 ip address 172.30.1.3/32
exit
!
interface vxlan110
 description VNI 110
exit
!
router bgp 65002
 bgp router-id 172.29.1.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor OVERLAY peer-group
 neighbor OVERLAY ebgp-multihop 2
 neighbor OVERLAY update-source lo
 neighbor OVERLAY capability extended-nexthop
 neighbor UNDERLAY peer-group
 neighbor 172.29.1.1 remote-as 65000
 neighbor 172.29.1.1 peer-group OVERLAY
 neighbor 172.29.1.2 remote-as 65001
 neighbor 172.29.1.2 peer-group OVERLAY
 neighbor 172.31.1.0 remote-as 65000
 neighbor 172.31.1.0 peer-group UNDERLAY
 neighbor 172.31.1.4 remote-as 65001
 neighbor 172.31.1.4 peer-group UNDERLAY
 !
 address-family ipv4 unicast
  redistribute connected route-map CONNECTED
  neighbor UNDERLAY activate
  neighbor UNDERLAY route-map PERMIT_ALL in
  neighbor UNDERLAY route-map PERMIT_ALL out
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor OVERLAY activate
  neighbor OVERLAY route-map PERMIT_ALL in
  neighbor OVERLAY route-map PERMIT_ALL out
  advertise-all-vni
 exit-address-family
 !
 bmp targets OPENBMP
  bmp stats interval 1000
  bmp mirror
  bmp monitor ipv4 unicast pre-policy
  bmp monitor ipv4 unicast post-policy
  bmp monitor l2vpn evpn pre-policy
  bmp monitor l2vpn evpn post-policy
  bmp connect 172.28.1.1 port 5000 min-retry 5000 max-retry 5000 source-interface eth0
 exit
exit
!
route-map CONNECTED permit 10
exit
!
route-map PERMIT_ALL permit 10
exit
!
end
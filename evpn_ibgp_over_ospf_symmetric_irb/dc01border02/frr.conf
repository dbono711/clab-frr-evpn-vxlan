frr defaults traditional
hostname dc01border02
log syslog
log file /etc/frr/logs/dc01border02.log
log record-priority
log timestamp precision 3
no log unique-id
no ipv6 forwarding
!
ip prefix-list TENANTA-SUBNETS seq 5 permit 10.10.1.0/24
ip prefix-list TENANTA-SUBNETS seq 10 permit 10.10.2.0/24
ip prefix-list TENANTB-SUBNETS seq 5 permit 10.10.3.0/24
!
route-map TENANTA-OSPF-REDIST permit 10
 match ip address prefix-list TENANTA-SUBNETS
exit
!
route-map TENANTA-OSPF-REDIST deny 20
exit
!
route-map TENANTB-OSPF-REDIST permit 10
 match ip address prefix-list TENANTB-SUBNETS
exit
!
route-map TENANTB-OSPF-REDIST deny 20
exit
!
vrf TenantA
 ip route 0.0.0.0/0 172.16.1.27
 vni 1000
exit-vrf
!
vrf TenantB
 ip route 0.0.0.0/0 172.16.1.29
 vni 2000
exit-vrf
!
interface eth1
 description to_dc01spine01
 ip address 172.16.1.22/31
 ip ospf network point-to-point
exit
!
interface eth2
 description to_dc01spine02
 ip address 172.16.1.24/31
 ip ospf network point-to-point
exit
!
interface eth5.1000
 description to_firewall_TenantA_inside
 ip address 172.16.1.26/31
 ip ospf network point-to-point
exit
!
interface eth5.2000
 description to_firewall_TenantB_inside
 ip address 172.16.1.28/31
 ip ospf network point-to-point
exit
!
interface lo
 ip address 172.29.1.7/32
 ip ospf passive
exit
!
interface lo1
 description VTEP
 ip address 172.30.1.7/32
 ip ospf passive
exit
!
router bgp 65000
 bgp router-id 172.29.1.7
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor OVERLAY peer-group
 neighbor OVERLAY remote-as internal
 neighbor OVERLAY update-source lo
 neighbor 172.29.1.1 peer-group OVERLAY
 neighbor 172.29.1.1 description dc01spine01
 neighbor 172.29.1.2 peer-group OVERLAY
 neighbor 172.29.1.2 description dc01spine02
 !
 address-family l2vpn evpn
  neighbor OVERLAY activate
  advertise-all-vni
 exit-address-family
exit
!
router bgp 65000 vrf TenantA
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
 exit-address-family
 !
 address-family l2vpn evpn
  rd 172.29.1.7:1000
  route-target import 65999:1000
  route-target export 65999:1000
  advertise ipv4 unicast
 exit-address-family
exit
!
router bgp 65000 vrf TenantB
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
 exit-address-family
 !
 address-family l2vpn evpn
  rd 172.29.1.7:2000
  route-target import 65999:2000
  route-target export 65999:2000
  advertise ipv4 unicast
 exit-address-family
exit
!
router ospf
 ospf router-id 172.29.1.7
 network 172.16.1.0/24 area 0.0.0.0
 network 172.29.1.7/32 area 0.0.0.0
 network 172.30.1.7/32 area 0.0.0.0
exit
!
router ospf vrf TenantA
 ospf router-id 3.3.3.3
 redistribute connected
 redistribute bgp route-map TENANTA-OSPF-REDIST
 network 172.16.1.26/31 area 0.0.0.0
exit
!
router ospf vrf TenantB
 ospf router-id 4.4.4.4
 redistribute connected
 redistribute bgp route-map TENANTB-OSPF-REDIST
 network 172.16.1.28/31 area 0.0.0.0
exit
!
end

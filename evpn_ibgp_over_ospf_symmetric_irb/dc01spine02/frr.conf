frr defaults traditional
hostname dc01spine02
log syslog
log file /etc/frr/logs/dc01spine02.log
log record-priority
log timestamp precision 3
no log unique-id
no ipv6 forwarding
!
debug bgp neighbor-events
debug bgp updates in
debug bgp updates out
!
interface eth1
 description to_dc01leaf01
 ip address 172.16.1.6/31
 ip ospf network point-to-point
exit
!
interface eth2
 description to_dc01leaf02
 ip address 172.16.1.8/31
 ip ospf network point-to-point
exit
!
interface eth3
 description to_dc01leaf03
 ip address 172.16.1.10/31
 ip ospf network point-to-point
exit
!
interface eth4
 description to_dc01border01
 ip address 172.16.1.14/31
 ip ospf network point-to-point
exit
!
interface eth5
 description to_dc01border02
 ip address 172.16.1.25/31
 ip ospf network point-to-point
exit
!
interface lo
 ip address 172.29.1.2/32
 ip ospf passive
exit
!
router bgp 65000
 bgp router-id 172.29.1.2
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor OVERLAY peer-group
 neighbor OVERLAY remote-as internal
 neighbor OVERLAY update-source lo
 neighbor 172.29.1.3 description dc01leaf01
 neighbor 172.29.1.3 peer-group OVERLAY
 neighbor 172.29.1.4 description dc01leaf02
 neighbor 172.29.1.4 peer-group OVERLAY
 neighbor 172.29.1.5 description dc01leaf03
 neighbor 172.29.1.5 peer-group OVERLAY
 neighbor 172.29.1.6 description dc01border01
 neighbor 172.29.1.6 peer-group OVERLAY
 neighbor 172.29.1.7 description dc01border02
 neighbor 172.29.1.7 peer-group OVERLAY
 !
 address-family l2vpn evpn
  neighbor OVERLAY activate
  neighbor OVERLAY route-reflector-client
 exit-address-family
exit
!
router ospf
 ospf router-id 172.29.1.2
 network 172.16.1.0/24 area 0.0.0.0
 network 172.29.1.2/32 area 0.0.0.0
exit
!
end

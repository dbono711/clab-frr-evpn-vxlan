frr defaults traditional
hostname spine01
log syslog
log file /etc/frr/logs/spine01.log
log record-priority
log timestamp precision 3
no log unique-id
no ipv6 forwarding
!
ip prefix-list CONNECTED-LOOPBACKS seq 5 permit 172.29.1.1/32
!
route-map CONNECTED permit 10
 match ip address prefix-list CONNECTED-LOOPBACKS
exit
!
route-map PERMIT_ALL permit 10
exit
!
debug bgp neighbor-events
debug bgp updates in
debug bgp updates out
!
interface eth1
 description LEAF01
 ip address 172.31.1.0/31
exit
!
interface eth2
 description LEAF02
 ip address 172.31.1.2/31
exit
!
interface eth3
 description LEAF03
 ip address 172.31.1.8/31
exit
!
interface lo
 description Router ID
 ip address 172.29.1.1/32
exit
!
router bgp 65000
 bgp router-id 172.29.1.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor OVERLAY peer-group
 neighbor OVERLAY ebgp-multihop 2
 neighbor OVERLAY update-source lo
 neighbor OVERLAY capability extended-nexthop
 neighbor UNDERLAY peer-group
 neighbor 172.29.1.3 remote-as 65002
 neighbor 172.29.1.3 peer-group OVERLAY
 neighbor 172.29.1.4 remote-as 65003
 neighbor 172.29.1.4 peer-group OVERLAY
 neighbor 172.29.1.5 remote-as 65004
 neighbor 172.29.1.5 peer-group OVERLAY
 neighbor 172.31.1.1 remote-as 65002
 neighbor 172.31.1.1 peer-group UNDERLAY
 neighbor 172.31.1.3 remote-as 65003
 neighbor 172.31.1.3 peer-group UNDERLAY
 neighbor 172.31.1.9 remote-as 65004
 neighbor 172.31.1.9 peer-group UNDERLAY
 !
 address-family ipv4 unicast
  redistribute connected route-map CONNECTED
  neighbor UNDERLAY activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor OVERLAY activate
  advertise-all-vni
 exit-address-family
exit

name: frr-evpn-vxlan

mgmt:
  network: br-frr-evpn-vxlan
  ipv4-subnet: 172.28.1.0/24

topology:
  nodes:

   # spine switches
    spine01:
      kind: linux
      image: quay.io/frrouting/frr:master
      mgmt-ipv4: 172.28.1.2
      binds:
        - logs:/etc/frr/logs
        - spine01/daemons:/etc/frr/daemons
        - spine01/frr.conf:/etc/frr/frr.conf
        - spine01/vtysh.conf:/etc/frr/vtysh.conf
        - spine01/spine01.sh:/config/spine01.sh
      exec:
        - bash /config/spine01.sh
    spine02:
      kind: linux
      image: quay.io/frrouting/frr:master
      mgmt-ipv4: 172.28.1.3
      binds:
        - logs:/etc/frr/logs
        - spine02/daemons:/etc/frr/daemons
        - spine02/frr.conf:/etc/frr/frr.conf
        - spine02/vtysh.conf:/etc/frr/vtysh.conf
        - spine02/spine02.sh:/config/spine02.sh
      exec:
        - bash /config/spine02.sh    
    
    # compute leaf switches
    leaf01:
      kind: linux
      image: quay.io/frrouting/frr:master
      mgmt-ipv4: 172.28.1.4
      binds:
        - logs:/etc/frr/logs
        - leaf01/daemons:/etc/frr/daemons
        - leaf01/frr.conf:/etc/frr/frr.conf
        - leaf01/vtysh.conf:/etc/frr/vtysh.conf
        - leaf01/leaf01.sh:/config/leaf01.sh
      exec:
        - bash /config/leaf01.sh
    leaf02:
      kind: linux
      image: quay.io/frrouting/frr:master
      mgmt-ipv4: 172.28.1.5
      binds:
        - logs:/etc/frr/logs
        - leaf02/daemons:/etc/frr/daemons
        - leaf02/frr.conf:/etc/frr/frr.conf
        - leaf02/vtysh.conf:/etc/frr/vtysh.conf
        - leaf02/leaf02.sh:/config/leaf02.sh
      exec:
        - bash /config/leaf02.sh
    
    # border leaf switches
    leaf03:
      kind: linux
      image: quay.io/frrouting/frr:master
      mgmt-ipv4: 172.28.1.6
      binds:
        - logs:/etc/frr/logs
        - leaf03/daemons:/etc/frr/daemons
        - leaf03/frr.conf:/etc/frr/frr.conf
        - leaf03/vtysh.conf:/etc/frr/vtysh.conf
        - leaf03/leaf03.sh:/config/leaf03.sh
      exec:
        - bash /config/leaf03.sh
    
    # gateway
    gateway:
      kind: linux
      image: quay.io/frrouting/frr:master
      mgmt-ipv4: 172.28.1.7
      binds:
        - logs:/etc/frr/logs
        - gateway/daemons:/etc/frr/daemons
        - gateway/frr.conf:/etc/frr/frr.conf
        - gateway/vtysh.conf:/etc/frr/vtysh.conf
        - gateway/gateway.sh:/config/gateway.sh
      exec:
        - bash /config/gateway.sh

    # clients
    client1:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      mgmt-ipv4: 172.28.1.8
      binds:
        - clients/client1.sh:/tmp/client1.sh
      exec:
        - bash /tmp/client1.sh
    client2:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      mgmt-ipv4: 172.28.1.9
      binds:
        - clients/client2.sh:/tmp/client2.sh
      exec:
        - bash /tmp/client2.sh
    client3:
      kind: linux
      image: wbitt/network-multitool:alpine-extra
      mgmt-ipv4: 172.28.1.10
      binds:
        - clients/client3.sh:/tmp/client3.sh
      exec:
        - bash /tmp/client3.sh

  links:
    - endpoints: ["leaf01:eth1", "spine01:eth1"]
    - endpoints: ["leaf01:eth2", "spine02:eth1"]
    - endpoints: ["leaf02:eth1", "spine01:eth2"]
    - endpoints: ["leaf02:eth2", "spine02:eth2"]
    - endpoints: ["leaf03:eth1", "spine01:eth3"]
    - endpoints: ["leaf03:eth2", "spine02:eth3"]
    - endpoints: ["gateway:eth1", "leaf03:eth3"]
    
    # dual-homed clients
    - endpoints: ["client1:eth1", "leaf01:eth3"]
    - endpoints: ["client1:eth2", "leaf02:eth3"]

    # single-homed clients
    - endpoints: ["client2:eth1", "leaf01:eth4"]
    - endpoints: ["client3:eth1", "leaf02:eth4"]
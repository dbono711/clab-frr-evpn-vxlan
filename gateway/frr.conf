frr defaults traditional
hostname gateway
no ipv6 forwarding
log syslog
log file /etc/frr/logs/gateway.log
log record-priority
log timestamp precision 3
no log unique-id
!
interface eth1
 description Connected to leaf03
exit
!
interface eth1.10
 description Tenant 10
 ip address 10.10.1.1/24
!
interface eth1.20
 description Tenant 20
 ip address 10.20.1.1/24
exit
